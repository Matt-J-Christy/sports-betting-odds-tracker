[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-betting-odds-tracker"
version = "0.2.0"
description = "Automated FanDuel line movement tracker for NFL and NCAA Football with BigQuery & Streamlit"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Matt Christy" }
]
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.10.0",
    "google-auth>=2.20.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "db-dtypes>=1.0.0",
    "pyarrow>=10.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
odds-tracker = "cli:cli"

[tool.setuptools.packages.find]
include = ["app*", "streamlit*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "odds",
    "__pycache__",
    "scripts/explore_odds_and_gcp.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",   # line too long — formatter handles this
    "N999",   # module name not lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
